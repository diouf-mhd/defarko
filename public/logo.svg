<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Defar ko">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a50e8"/>
      <stop offset="1" stop-color="#14178a"/>
    </linearGradient>
    <mask id="jaw" maskUnits="userSpaceOnUse" x="-120" y="-160" width="240" height="320">
      <rect x="-120" y="-160" width="240" height="320" fill="#fff"/>
      <rect x="-14" y="-118" width="28" height="48" rx="4" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Roue dentée : tous les métiers de la mécanique et du bâtiment -->
  <g transform="translate(256 256)" fill="#fff">
    <circle r="124" fill="none" stroke="#fff" stroke-width="42"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(45)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(90)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(135)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(180)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(225)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(270)"/>
    <rect x="-24" y="-178" width="48" height="54" rx="10" transform="rotate(315)"/>
  </g>
  <!-- Marteau et clé en croix -->
  <g transform="translate(256 252) scale(0.92)">
    <g transform="rotate(45)" fill="#f6b13b">
      <rect x="-9" y="-58" width="18" height="146" rx="9"/>
      <rect x="-38" y="-88" width="76" height="36" rx="10"/>
    </g>
    <g transform="rotate(-45)" fill="#fff">
      <rect x="-9" y="-58" width="18" height="146" rx="9"/>
      <g mask="url(#jaw)">
        <circle cx="0" cy="-74" r="32"/>
      </g>
    </g>
  </g>
</svg>
